<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход / Регистрация - Core Acolytes</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <style>
        .auth-main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 85px);
            padding: 2rem;
            padding-top: 105px;
        }

        .auth-card {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .auth-tab {
            flex: 1;
            padding: 0.8rem;
            background: transparent;
            border: none;
            color: #666;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form h2 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            color: #aaaaaa;
            font-size: 0.9rem;
        }

        .form-group input {
            padding: 0.9rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .auth-btn {
            padding: 1rem;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            background: rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .auth-error {
            color: #ff6666;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.5rem;
            background: rgba(255, 80, 80, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(255, 80, 80, 0.3);
            display: none;
        }

        .auth-success {
            color: #00d4ff;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="index.html"><img src="img/logo.png" alt="Core Acolytes"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Готовые сборки</a></li>
                <li><a href="configurator.html">Конструктор</a></li>
                <li><a href="cart.html">Корзина</a></li>
                <li><a href="contact.html">О нас</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form class="auth-form active" id="login-form">
                <h2>Добро пожаловать</h2>
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="login-username" placeholder="Введите логин" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="Введите пароль" required>
                </div>
                <div class="auth-error" id="login-error"></div>
                <button type="submit" class="auth-btn">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form class="auth-form" id="register-form">
                <h2>Создать аккаунт</h2>
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" placeholder="Придумайте логин" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" placeholder="Минимум 6 символов" required>
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="reg-password2" placeholder="Повторите пароль" required>
                </div>
                <div class="auth-error" id="register-error"></div>
                <div class="auth-success" id="register-success"></div>
                <button type="submit" class="auth-btn">Зарегистрироваться</button>
            </form>
        </div>
    </main>

    <script>
        
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-form').classList.add('active');
            });
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            errorEl.style.display = 'none';

            try {
                const res = await fetch('http://127.0.0.1:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Ошибка входа');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                if (data.user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (password !== password2) {
                errorEl.textContent = 'Пароли не совпадают';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = 'Пароль должен быть не менее 6 символов';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('http://127.0.0.1:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Ошибка регистрации');

                successEl.textContent = '✅ Аккаунт создан! Переходим ко входу...';
                successEl.style.display = 'block';

                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('login-username').value = username;
                }, 1500);
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
